[project]
name = "hmore-ai-service"
version = "0.1.0"
description = "HMore shared AI service foundation"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.6",
  "langgraph==0.3.34",
  "pydantic-settings==2.7.1",
  "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.3.5",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "real_llm: tests that call a real LLM provider (skipped without credentials)",
]
