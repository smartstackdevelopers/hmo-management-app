services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: hmore
      POSTGRES_USER: hmore
      POSTGRES_PASSWORD: hmore
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hmore -d hmore"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - hmore_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    environment:
      ENVIRONMENT: development
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+psycopg://hmore:hmore@postgres:5432/hmore
      AI_SERVICE_TOKEN: local-dev-ai-service-token
      AI_SERVICE_BASE_URL: http://ai:8001
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 8

  ai:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.ai
    environment:
      ENVIRONMENT: development
      LLM_PROVIDER: none
      REDIS_URL: redis://redis:6379/0
      AI_CACHE_BACKEND: memory
      AI_BATCH_EAGER: "true"
      # Override locally; never commit a real production token.
      AI_SERVICE_TOKEN: local-dev-ai-service-token
      CORE_API_BASE_URL: http://api:8000
      AI_BUDGET_ENFORCEMENT_FAIL_OPEN: "false"
    ports:
      - "8001:8001"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 8

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  hmore_pg:
