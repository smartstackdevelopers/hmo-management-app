name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main, "chore/phase1-*", "feature/phase1-*"]

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
        working-directory: .
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          # Placeholders so @auth0/nextjs-auth0 can initialise. Not a real tenant.
          AUTH0_DOMAIN: example.uk.auth0.com
          AUTH0_CLIENT_ID: ci-placeholder-client
          AUTH0_CLIENT_SECRET: ci-placeholder-secret
          AUTH0_SECRET: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          APP_BASE_URL: http://localhost:3000
          AUTH0_AUDIENCE: https://api.hmore.local
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: true
          AUTH0_DOMAIN: example.uk.auth0.com
          AUTH0_CLIENT_ID: ci-placeholder-client
          AUTH0_CLIENT_SECRET: ci-placeholder-secret
          AUTH0_SECRET: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          APP_BASE_URL: http://localhost:3000
          AUTH0_AUDIENCE: https://api.hmore.local

  mobile:
    name: Mobile typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w room-ready

  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: hmore_test
          POSTGRES_USER: hmore
          POSTGRES_PASSWORD: hmore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hmore -d hmore_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://hmore:hmore@localhost:5432/hmore_test
      TEST_DATABASE_URL: postgresql+psycopg://hmore:hmore@localhost:5432/hmore_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m compileall app
      - run: alembic upgrade head
      - run: pytest -q

  ai:
    name: AI service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/ai-service/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m compileall app
      - run: pytest -q

  secrets-hygiene:
    name: Secrets hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject committed dotenv secrets and private keys
        shell: bash
        run: |
          set -euo pipefail
          # Fail if real .env files (not examples) are tracked
          if git ls-files | grep -E '(^|/)\.env$' ; then
            echo "Tracked .env file found — remove from git"
            exit 1
          fi
          # Fail on private key PEM material in the tree (excluding docs mentioning the marker in checklists)
          # Match real PEM headers only; exclude docs/tests that mention markers safely.
          if git grep -nE --cached '-----BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY-----' -- \
              ':!docs/**' ':!**/tests/**' ':!.github/workflows/ci.yml' ; then
            echo "Private key material appears committed"
            exit 1
          fi
          # Heuristic: AWS access key id pattern (exclude CI workflow + F1.11 example fixture)
          if git grep -nE --cached 'AKIA[0-9A-Z]{16}' -- \
              ':!.github/workflows/ci.yml' ':!**/tests/**' ; then
            echo "Possible AWS access key id committed"
            exit 1
          fi
          echo "Secrets hygiene checks passed"
